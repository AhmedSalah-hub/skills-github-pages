<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Ahmed Salah - Software Engineer</title>
  <meta name="description" content="Software Engineer & .NET Developer. Writing about C#, .NET 9, Entity Framework Core, SQL Server, and Clean Architecture.">
  <style>
    :root {
      --primary: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #243247;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-tag: rgba(56, 189, 248, 0.12);
      --code-bg: #090d16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* Header & Navigation */
    .site-header {
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 1rem 0;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-title {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.25rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .site-nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .site-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .site-nav a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* Main Content */
    .page-content {
      flex: 1;
      padding: 2.5rem 0 4rem;
    }

    /* Typography */
    h1, h2, h3, h4 {
      color: #ffffff;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-top: 1.8em;
      margin-bottom: 0.8em;
    }

    h1 { font-size: 2.2rem; }
    h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; }
    h3 { font-size: 1.25rem; }

    p { margin-bottom: 1.25rem; }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Hero Section */
    .hero-container {
      padding: 2.5rem 0 1.5rem;
    }

    .hero-pill {
      display: inline-block;
      padding: 6px 14px;
      background: var(--primary-gradient);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .hero-title {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.2;
      margin-top: 0;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 720px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--primary-gradient);
      color: #ffffff !important;
      font-weight: 600;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      text-decoration: none !important;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main) !important;
      font-weight: 600;
      border-radius: 8px;
      transition: transform 0.2s, background-color 0.2s;
      text-decoration: none !important;
    }

    .btn-secondary:hover {
      background-color: var(--card-hover);
      border-color: #475569;
      transform: translateY(-2px);
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0 2.5rem;
    }

    .project-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .project-card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
    }

    .project-card h3 a {
      color: #ffffff;
      text-decoration: none;
    }

    .project-card h3 a:hover {
      color: var(--accent);
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1rem;
    }

    .tech-tag {
      display: inline-block;
      padding: 3px 10px;
      background-color: var(--accent-tag);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .project-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Post list */
    .post-list {
      margin: 1.5rem 0;
      padding: 0;
      list-style: none;
    }

    .post-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s, transform 0.2s;
    }

    .post-item:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .post-meta {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .post-link {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff !important;
      display: block;
      margin-bottom: 6px;
      text-decoration: none !important;
    }

    .post-link:hover {
      color: var(--accent) !important;
    }

    .post-excerpt {
      color: var(--text-muted);
      margin-bottom: 0;
      font-size: 0.95rem;
    }

    /* Article view */
    .post-header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .post-header .post-title {
      font-size: 2.2rem;
      margin-top: 0.5rem;
    }

    /* Code blocks */
    pre, code {
      font-family: "Fira Code", Consolas, Monaco, monospace;
    }

    pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.2rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    code {
      background-color: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-size: 0.9em;
    }

    pre code {
      background-color: transparent;
      padding: 0;
      color: inherit;
    }

    ul, ol {
      margin-left: 1.5rem;
      margin-bottom: 1.25rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 2.5rem 0;
    }

    /* Footer */
    .site-footer {
      background-color: #0b1120;
      border-top: 1px solid var(--border-color);
      padding: 2.5rem 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    @media screen and (max-width: 600px) {
      .hero-title { font-size: 2rem; }
      .projects-grid { grid-template-columns: 1fr; }
      .nav-container { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrapper nav-container">
      <a class="site-title" href="{{ '/' | relative_url }}">⚡ Ahmed Salah</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/AhmedSalah-hub" target="_blank" rel="noopener">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper footer-content">
      <p>© {{ 'now' | date: "%Y" }} Ahmed Salah. Built with Jekyll & GitHub Pages.</p>
      <p><a href="https://github.com/AhmedSalah-hub" target="_blank" rel="noopener">github.com/AhmedSalah-hub</a></p>
    </div>
  </footer>

</body>
</html>
